name: lab
# Paper strategy lab: backtest + forward test. Daily, plus manual runs. No keys, no orders.
on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Lab run (paper only)
        run: python bot/lab.py
        env:
          LAB_NOTIFY: "1"
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "lab $(date -u +%FT%TZ)"
          git pull --rebase || true
          git push
