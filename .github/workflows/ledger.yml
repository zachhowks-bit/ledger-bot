name: ledger
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit + fault-injection tests
        run: python -m unittest discover -s tests -v
      - name: Paper run (no keys, no real orders)
        run: python bot/ledger.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "state $(date -u +%FT%TZ)"
          git pull --rebase || true
          git push
